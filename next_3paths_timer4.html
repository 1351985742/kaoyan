<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>多元复合函数进阶 · 下 3 条核心路径 (共 8 题) 计时控制台</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @font-face {
      font-family: 'TimerMono';
      src: local('Menlo'), local('Monaco'), local('Courier New'), monospace;
    }
    .font-mono-timer {
      font-family: 'TimerMono', monospace;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-1 select-none">
  <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-3.5 shadow-sm max-w-xl mx-auto transition-all">
    
    <!-- Header -->
    <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-[var(--border)]">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-teal-500 animate-pulse"></span>
          <h2 class="text-sm font-bold tracking-tight text-[var(--foreground)]">多元复合求导 · 3 条进阶路径 (全量 8 题)</h2>
        </div>
        <p class="text-xs text-[var(--muted-foreground)] mt-0.5">齐次缩放与反求外层 (4题) + 边界恢复一元 (1题) + 二阶前因子链式对冲 (3题)</p>
      </div>
      <div class="text-right">
        <span id="overallProgress" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-[var(--secondary)] text-[var(--foreground)]">完成: 0 / 8</span>
      </div>
    </div>

    <!-- Problems List Container -->
    <div id="itemsContainer" class="space-y-1.5 max-h-[380px] overflow-y-auto pr-1">
      <!-- Items dynamically rendered by JS -->
    </div>

    <!-- Footer Summary & Batch Copy -->
    <div class="mt-3 pt-2.5 border-t border-[var(--border)] flex items-center justify-between gap-3">
      <div class="text-xs text-[var(--muted-foreground)]">
        总耗时: <span id="totalTimeDisplay" class="font-mono-timer font-semibold text-[var(--foreground)]">00:00</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="batchCopyBtn" onclick="exportAndCopy()" class="px-3 py-1.5 rounded-xl bg-teal-600 hover:bg-teal-500 text-white font-medium text-xs shadow-sm hover:shadow transition-all flex items-center gap-1.5 cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
          一键导出 8 题作答文本
        </button>
      </div>
    </div>

    <!-- Fallback Text Drawer -->
    <div id="exportDrawer" class="mt-2.5 pt-2 border-t border-[var(--border)] hidden">
      <div class="flex items-center justify-between mb-1">
        <span class="text-[11px] font-semibold text-[var(--muted-foreground)]">作答与耗时文本（可直接点全选复制）：</span>
        <button onclick="selectDrawerText()" class="text-[11px] text-teal-500 hover:underline cursor-pointer">全选并复制</button>
      </div>
      <textarea id="drawerText" rows="4" readonly 
        class="w-full text-[11px] font-mono-timer p-2 rounded-xl bg-[var(--background)] border border-[var(--border)] text-[var(--foreground)] resize-none focus:outline-none"></textarea>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="mt-2 p-2 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-center text-xs text-emerald-600 dark:text-emerald-400 font-medium hidden">
      ✅ 已复制到剪贴板！直接在聊天框 Cmd+V 发送
    </div>

  </div>

  <script>
    const items = [
      { id: '2478', num: '003', path: '缩放反求·锚点', name: '1995 数三真题 (z=xy f(y/x) 齐次加权恒等式)', targetMins: 1.5, elapsed: 0, state: 'ready' },
      { id: '2479', num: '004', path: '缩放反求·变式1', name: '2019 数二真题 (z=y f(y²/x) 加权缩放不变量)', targetMins: 1.5, elapsed: 0, state: 'ready' },
      { id: '2483', num: '008', path: '缩放反求·变式2', name: '2022 数一真题 (恒等式反求外层函数 f(1), f\'(1))', targetMins: 2.0, elapsed: 0, state: 'ready' },
      { id: '2484', num: '009', path: '缩放反求·变式3', name: '660 第229题 (根式加权组合反求解析式)', targetMins: 2.0, elapsed: 0, state: 'ready' },
      { id: '2486', num: '011', path: '边界恢复·锚点', name: '660 第95题 (边界线 y=0 偏导联立反求一元函数)', targetMins: 2.0, elapsed: 0, state: 'ready' },
      { id: '2487', num: '001', path: '复合二阶·锚点', name: '1998 数一真题 (z=1/x f(xy)+yφ(x+y) 二阶混合偏导)', targetMins: 2.0, elapsed: 0, state: 'ready' },
      { id: '2488', num: '002', path: '复合二阶·变式1', name: '2005 数三真题 (比例内层二阶偏导差式相消)', targetMins: 2.5, elapsed: 0, state: 'ready' },
      { id: '2489', num: '003', path: '复合二阶·变式2', name: '660 第233题 (z=x f(x-y)+y g(x+y) 二阶项完美对冲)', targetMins: 2.0, elapsed: 0, state: 'ready' }
    ];

    let activeIndex = null;
    let ticker = null;

    function formatSecs(s) {
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return String(m).padStart(2, '0') + ':' + String(rem).padStart(2, '0');
    }

    function render() {
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      let finishedCount = 0;
      let totalElapsed = 0;

      items.forEach((item, idx) => {
        totalElapsed += item.elapsed;
        if (item.state === 'finished') finishedCount++;

        const isRunning = item.state === 'running';
        const isFinished = item.state === 'finished';
        const isPaused = item.state === 'paused';

        const row = document.createElement('div');
        row.className = `p-2 rounded-xl border transition-all flex items-center justify-between gap-2 ${
          isRunning 
            ? 'bg-teal-500/10 border-teal-500/40 ring-1 ring-teal-500/30' 
            : isFinished 
              ? 'bg-emerald-500/5 border-emerald-500/20 opacity-85'
              : 'bg-[var(--secondary)]/40 border-[var(--border)] hover:border-[var(--border)]/80'
        }`;

        row.innerHTML = `
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-[11px] font-bold px-1.5 py-0.5 rounded-md ${
              isFinished ? 'bg-emerald-500/20 text-emerald-600 dark:text-emerald-400' : 'bg-[var(--secondary)] text-[var(--muted-foreground)]'
            }">
              ${item.path}
            </span>
            <div class="min-w-0">
              <div class="text-xs font-medium text-[var(--foreground)] truncate">
                ${item.num} · ${item.name}
              </div>
              <div class="text-[10px] text-[var(--muted-foreground)]">
                目标: ${item.targetMins}m · ID: ${item.id}
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2 shrink-0">
            <span class="font-mono-timer text-xs font-semibold ${
              isRunning ? 'text-teal-600 dark:text-teal-400' : isFinished ? 'text-emerald-600 dark:text-emerald-400' : 'text-[var(--muted-foreground)]'
            }">
              ${formatSecs(item.elapsed)}
            </span>

            <div class="flex items-center gap-1">
              ${!isRunning ? `
                <button onclick="startTimer(${idx})" class="p-1 px-1.5 rounded-lg bg-[var(--card)] hover:bg-[var(--accent)] border border-[var(--border)] text-[11px] font-medium transition cursor-pointer">
                  ${isPaused ? '继续' : isFinished ? '重测' : '开始'}
                </button>
              ` : `
                <button onclick="pauseTimer(${idx})" class="p-1 px-1.5 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-700 dark:text-amber-400 border border-amber-500/30 text-[11px] font-medium transition cursor-pointer">
                  暂停
                </button>
              `}

              ${isRunning || isPaused ? `
                <button onclick="finishTimer(${idx})" class="p-1 px-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-medium transition cursor-pointer">
                  完成
                </button>
              ` : ''}
            </div>
          </div>
        `;

        container.appendChild(row);
      });

      document.getElementById('overallProgress').innerText = `完成: ${finishedCount} / ${items.length}`;
      document.getElementById('totalTimeDisplay').innerText = formatSecs(totalElapsed);
    }

    function startTimer(idx) {
      if (activeIndex !== null && activeIndex !== idx) {
        if (items[activeIndex].state === 'running') {
          items[activeIndex].state = 'paused';
        }
      }
      clearInterval(ticker);
      activeIndex = idx;
      items[idx].state = 'running';

      ticker = setInterval(() => {
        items[idx].elapsed++;
        render();
      }, 1000);

      render();
    }

    function pauseTimer(idx) {
      clearInterval(ticker);
      items[idx].state = 'paused';
      render();
    }

    function finishTimer(idx) {
      clearInterval(ticker);
      items[idx].state = 'finished';
      activeIndex = null;
      render();
    }

    function generateReportText() {
      let lines = ['【多元复合求导进阶 · 8 题实战作答】'];
      let total = 0;
      items.forEach(it => {
        total += it.elapsed;
        const timeStr = formatSecs(it.elapsed);
        lines.push(`- [ID ${it.id}] ${it.path} (${it.num}): 你的答案 [  ] (耗时 ${timeStr})`);
      });
      lines.push(`总用时: ${formatSecs(total)}`);
      return lines.join('\\n');
    }

    function exportAndCopy() {
      const text = generateReportText();
      const drawer = document.getElementById('exportDrawer');
      const drawerText = document.getElementById('drawerText');
      const toast = document.getElementById('toast');

      drawerText.value = text;
      drawer.classList.remove('hidden');

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showToast();
        }).catch(() => {
          selectDrawerText();
        });
      } else {
        selectDrawerText();
      }
    }

    function selectDrawerText() {
      const drawerText = document.getElementById('drawerText');
      drawerText.focus();
      drawerText.select();
      try {
        document.execCommand('copy');
        showToast();
      } catch (err) {
        // Fallback
      }
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3500);
    }

    render();
  </script>
</body>
</html>
