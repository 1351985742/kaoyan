<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>隐函数全微分 4 条路径 · 攻坚控制台</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @font-face {
      font-family: 'TimerMono';
      src: local('Menlo'), local('Monaco'), local('Courier New'), monospace;
    }
    .font-mono-timer {
      font-family: 'TimerMono', monospace;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-1 select-none">
  <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-3.5 shadow-sm max-w-xl mx-auto transition-all">
    
    <!-- Header -->
    <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-[var(--border)]">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
          <h2 class="text-sm font-bold tracking-tight text-[var(--foreground)]">隐函数全微分 · 4 路径通关</h2>
        </div>
        <p class="text-xs text-[var(--muted-foreground)] mt-0.5">代数隐式微分 + 变限积分微分 + 外层嵌入消元 + 抽象对称消项</p>
      </div>
      <div class="text-right">
        <span id="overallProgress" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-[var(--secondary)] text-[var(--foreground)]">完成: 0 / 4</span>
      </div>
    </div>

    <!-- Problems List Container -->
    <div id="itemsContainer" class="space-y-1.5 max-h-[320px] overflow-y-auto pr-1">
      <!-- Items dynamically rendered by JS -->
    </div>

    <!-- Footer Summary & Batch Copy -->
    <div class="mt-3 pt-2.5 border-t border-[var(--border)] flex items-center justify-between gap-3">
      <div class="text-xs text-[var(--muted-foreground)]">
        总耗时: <span id="totalTimeDisplay" class="font-mono-timer font-semibold text-[var(--foreground)]">00:00</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="batchCopyBtn" onclick="exportAndCopy()" class="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-medium text-xs shadow-sm hover:shadow transition-all flex items-center gap-1.5 cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
          一键导出 4 题作答文本
        </button>
      </div>
    </div>

    <!-- Fallback Text Drawer -->
    <div id="exportDrawer" class="mt-2.5 pt-2 border-t border-[var(--border)] hidden">
      <div class="flex items-center justify-between mb-1">
        <span class="text-[11px] font-semibold text-[var(--muted-foreground)]">作答与耗时文本（可直接点全选复制）：</span>
        <button onclick="selectDrawerText()" class="text-[11px] text-amber-500 hover:underline cursor-pointer">全选并复制</button>
      </div>
      <textarea id="drawerText" rows="4" readonly 
        class="w-full text-[11px] font-mono-timer p-2 rounded-xl bg-[var(--background)] border border-[var(--border)] text-[var(--foreground)] resize-none focus:outline-none"></textarea>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="mt-2 p-2 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-center text-xs text-emerald-600 dark:text-emerald-400 font-medium hidden">
      ✅ 已复制到剪贴板！直接在聊天框 Cmd+V 发送
    </div>

  </div>

  <script>
    const items = [
      { id: '2629', num: '001', path: 'P1·代数隐式微分', name: '660 第93题 (x² + y² + z² = 3 两边直接求微分解 dz(1,1,1))', targetMins: 1.5, elapsed: 0, state: 'ready' },
      { id: '2632', num: '002', path: 'P2·变限积分隐式', name: '1000 强化14 (sin(x - y) + ∫ e⁻ᵗ²dt = 0 变限定点求 dz(0,0))', targetMins: 2.0, elapsed: 0, state: 'ready' },
      { id: '2633', num: '003', path: 'P3·双层嵌入消元', name: '2002 数三真题 (u = f(x,y,z), xeˣ - yeʸ = zeᶻ 嵌入消元求 du)', targetMins: 2.5, elapsed: 0, state: 'ready' },
      { id: '2636', num: '004', path: 'P4·抽象对称消项', name: '900 强化24 (F(xyz, √(x²+y²+z²)) = 0 对称点公因子约分求 dz)', targetMins: 2.0, elapsed: 0, state: 'ready' }
    ];

    let activeIndex = null;
    let ticker = null;

    function formatSecs(s) {
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return String(m).padStart(2, '0') + ':' + String(rem).padStart(2, '0');
    }

    function render() {
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      let finishedCount = 0;
      let totalElapsed = 0;

      items.forEach((item, idx) => {
        totalElapsed += item.elapsed;
        if (item.state === 'finished') finishedCount++;

        const isRunning = item.state === 'running';
        const isFinished = item.state === 'finished';
        const isPaused = item.state === 'paused';

        const row = document.createElement('div');
        row.className = `p-2 rounded-xl border transition-all flex items-center justify-between gap-2 ${
          isRunning 
            ? 'bg-amber-500/10 border-amber-500/40 ring-1 ring-amber-500/30' 
            : isFinished 
              ? 'bg-emerald-500/5 border-emerald-500/20 opacity-85'
              : 'bg-[var(--secondary)]/40 border-[var(--border)] hover:border-[var(--border)]/80'
        }`;

        row.innerHTML = `
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-[11px] font-bold px-1.5 py-0.5 rounded-md ${
              isFinished ? 'bg-emerald-500/20 text-emerald-600 dark:text-emerald-400' : 'bg-[var(--secondary)] text-[var(--muted-foreground)]'
            }">
              ${item.path}
            </span>
            <div class="min-w-0">
              <div class="text-xs font-medium text-[var(--foreground)] truncate flex items-center gap-1.5">
                <span>${item.num}.</span>
                <span class="truncate">${item.name}</span>
              </div>
              <div class="text-[10px] text-[var(--muted-foreground)]">目标: ${item.targetMins} 分钟</div>
            </div>
          </div>

          <div class="flex items-center gap-1.5 shrink-0">
            <span class="font-mono-timer text-xs font-semibold px-2 py-0.5 rounded-lg ${
              isRunning ? 'text-amber-600 dark:text-amber-400 bg-amber-500/10' : 'text-[var(--foreground)] bg-[var(--background)]'
            }">
              ${formatSecs(item.elapsed)}
            </span>

            ${!isFinished ? `
              <button onclick="toggleTimer(${idx})" class="p-1 rounded-lg text-xs font-medium transition-all cursor-pointer ${
                isRunning 
                  ? 'bg-amber-500/15 hover:bg-amber-500/25 text-amber-600 dark:text-amber-400' 
                  : 'bg-amber-600 hover:bg-amber-500 text-white shadow-xs'
              }">
                ${isRunning ? '暂停' : (isPaused ? '继续' : '开始')}
              </button>
              <button onclick="finishItem(${idx})" class="p-1 rounded-lg text-xs font-medium bg-[var(--secondary)] hover:bg-[var(--secondary)]/80 text-[var(--muted-foreground)] hover:text-[var(--foreground)] cursor-pointer">
                完成
              </button>
            ` : `
              <button onclick="reopenItem(${idx})" class="p-1 text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)] underline cursor-pointer">
                重测
              </button>
            `}
          </div>
        `;
        container.appendChild(row);
      });

      document.getElementById('overallProgress').innerText = `完成: ${finishedCount} / ${items.length}`;
      document.getElementById('totalTimeDisplay').innerText = formatSecs(totalElapsed);
    }

    function toggleTimer(idx) {
      if (activeIndex === idx) {
        clearInterval(ticker);
        ticker = null;
        items[idx].state = 'paused';
        activeIndex = null;
      } else {
        if (activeIndex !== null) {
          clearInterval(ticker);
          if (items[activeIndex].state === 'running') {
            items[activeIndex].state = 'paused';
          }
        }
        activeIndex = idx;
        items[idx].state = 'running';
        ticker = setInterval(() => {
          items[idx].elapsed++;
          render();
        }, 1000);
      }
      render();
    }

    function finishItem(idx) {
      if (activeIndex === idx) {
        clearInterval(ticker);
        ticker = null;
        activeIndex = null;
      }
      items[idx].state = 'finished';
      render();
    }

    function reopenItem(idx) {
      items[idx].state = 'ready';
      render();
    }

    function exportAndCopy() {
      let lines = ["【隐函数全微分 4 题作答记录】"];
      let total = 0;
      items.forEach(it => {
        total += it.elapsed;
        const status = it.state === 'finished' ? '已完成' : (it.elapsed > 0 ? '进行中' : '未作答');
        lines.push(`${it.num} [ID ${it.id}] ${it.name}: 耗时 ${formatSecs(it.elapsed)} (${status})`);
      });
      lines.push(`总耗时: ${formatSecs(total)}`);
      const txt = lines.join('\n');

      const drawer = document.getElementById('exportDrawer');
      const drawerText = document.getElementById('drawerText');
      drawer.classList.remove('hidden');
      drawerText.value = txt;

      navigator.clipboard.writeText(txt).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 3500);
      }).catch(() => {
        drawerText.select();
      });
    }

    function selectDrawerText() {
      const drawerText = document.getElementById('drawerText');
      drawerText.select();
      document.execCommand('copy');
      const toast = document.getElementById('toast');
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    render();
  </script>
</body>
</html>
