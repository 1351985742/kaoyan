<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>已知重极限求极值 · P2 二次主部变号或退化 计时控制台</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @font-face {
      font-family: 'TimerMono';
      src: local('Menlo'), local('Monaco'), local('Courier New'), monospace;
    }
    .font-mono-timer {
      font-family: 'TimerMono', monospace;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-1 select-none">
  <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-3.5 shadow-sm max-w-xl mx-auto transition-all">
    
    <!-- Header -->
    <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-[var(--border)]">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse"></span>
          <h2 class="text-sm font-bold tracking-tight text-[var(--foreground)]">当前唯一路径 · P2 二次主部变号或退化</h2>
        </div>
        <p class="text-xs text-[var(--muted-foreground)] mt-0.5">鞍点双向变号判非极值 / 半正定退化信息不足判别 (共 2 题)</p>
      </div>
      <div class="text-right">
        <span id="overallProgress" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-[var(--secondary)] text-[var(--foreground)]">完成: 0 / 2</span>
      </div>
    </div>

    <!-- Problems List Container -->
    <div id="itemsContainer" class="space-y-2 max-h-[340px] overflow-y-auto pr-1">
      <!-- Items dynamically rendered by JS -->
    </div>

    <!-- Footer Summary & Batch Copy -->
    <div class="mt-3 pt-2.5 border-t border-[var(--border)] flex items-center justify-between">
      <div class="text-xs text-[var(--muted-foreground)]">
        总耗时：<span id="totalTimeDisplay" class="font-mono-timer font-semibold text-[var(--foreground)]">00:00</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleExportDrawer()" class="text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)] px-2 py-1 rounded-lg border border-[var(--border)] transition cursor-pointer">
          文本框
        </button>
        <button onclick="copyAllFinished()" id="btnCopyAll" class="bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 active:scale-95 text-xs font-semibold py-1.5 px-3 rounded-xl transition flex items-center gap-1.5 shadow-xs cursor-pointer">
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          <span id="btnCopyAllText">一键复制本组耗时</span>
        </button>
      </div>
    </div>

    <!-- Fallback Text Drawer -->
    <div id="exportDrawer" class="mt-2.5 pt-2 border-t border-[var(--border)] hidden">
      <div class="flex items-center justify-between mb-1">
        <span class="text-[11px] font-semibold text-[var(--muted-foreground)]">作答与耗时文本（可直接点全选复制）：</span>
        <button onclick="selectDrawerText()" class="text-[11px] text-blue-500 hover:underline cursor-pointer">全选并复制</button>
      </div>
      <textarea id="drawerText" rows="3" readonly 
        class="w-full text-[11px] font-mono-timer p-2 rounded-xl bg-[var(--background)] border border-[var(--border)] text-[var(--foreground)] resize-none focus:outline-none"></textarea>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="mt-2 p-2 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-center text-xs text-emerald-600 dark:text-emerald-400 font-medium hidden">
      ✅ 已复制到剪贴板！直接在聊天框 Cmd+V 发送
    </div>

  </div>

  <script>
    const items = [
      { id: '2225', num: '001', path: 'P2-锚点', name: '2003 数一真题 ((f-xy)/ρ⁴=1 主部xy沿y=±x变号鞍点)', targetMins: 2, elapsed: 0, state: 'ready' },
      { id: '2228', num: '004', path: 'P2-变式', name: '900 数二 B-13 ((f-xy)/ρ²=1/2 主部(x+y)²/2半正定退化)', targetMins: 2.5, elapsed: 0, state: 'ready' }
    ];

    let activeIndex = null;
    let ticker = null;

    function formatSecs(s) {
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return String(m).padStart(2, '0') + ':' + String(rem).padStart(2, '0');
    }

    function render() {
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      let finishedCount = 0;
      let totalElapsed = 0;

      items.forEach((item, idx) => {
        totalElapsed += item.elapsed;
        if (item.state === 'finished') finishedCount++;

        const isRunning = item.state === 'running';
        const isPaused = item.state === 'paused';
        const isFinished = item.state === 'finished';

        const row = document.createElement('div');
        row.className = `p-2.5 rounded-xl border transition-all ${
          isRunning 
            ? 'bg-blue-500/5 border-blue-500/40 shadow-xs' 
            : isFinished 
              ? 'bg-[var(--secondary)]/40 border-slate-300 dark:border-slate-800 opacity-90' 
              : 'bg-[var(--card)] border-[var(--border)] hover:border-slate-400 dark:hover:border-slate-700'
        }`;

        let timerColor = 'text-[var(--foreground)]';
        let badgeColor = 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300';
        let badgeText = '待开始';

        if (isRunning) {
          timerColor = 'text-blue-600 dark:text-blue-400';
          badgeColor = 'bg-blue-500/20 text-blue-600 dark:text-blue-400 animate-pulse';
          badgeText = '做题中';
        } else if (isPaused) {
          timerColor = 'text-blue-500';
          badgeColor = 'bg-blue-500/20 text-blue-600 dark:text-blue-400';
          badgeText = '暂停中';
        } else if (isFinished) {
          timerColor = 'text-slate-500 dark:text-slate-400';
          badgeColor = 'bg-slate-200 text-slate-600 dark:bg-slate-800 dark:text-slate-400';
          badgeText = '已完成';
        }

        row.innerHTML = `
          <div class="flex items-center justify-between gap-2.5">
            <!-- Left Info -->
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-xs font-semibold px-1 py-0.5 bg-blue-500/10 text-blue-600 dark:text-blue-400 rounded">${item.path}</span>
                <span class="text-xs font-bold text-[var(--foreground)] truncate">${item.num}. ${item.name}</span>
                <span class="text-xs px-1.5 py-0.5 rounded font-medium ${badgeColor}">${badgeText}</span>
              </div>
              <div class="text-xs text-[var(--muted-foreground)] mt-0.5 flex items-center gap-2">
                <span>[ID ${item.id}]</span>
                <span>目标: ${item.targetMins} 分钟</span>
              </div>
            </div>

            <!-- Right Controls -->
            <div class="flex items-center gap-2 shrink-0">
              <!-- Live Timer Display -->
              <div class="text-right font-mono-timer text-sm font-bold min-w-[50px] ${timerColor}">
                ${formatSecs(item.elapsed)}
              </div>

              <!-- Buttons -->
              <div class="flex items-center gap-1">
                ${!isFinished ? `
                  <button onclick="toggleProblem(${idx})" class="p-1.5 rounded-lg border transition cursor-pointer ${
                    isRunning 
                      ? 'bg-blue-500/10 border-blue-500/30 text-blue-600 hover:bg-blue-500/20' 
                      : 'bg-blue-500/10 border-blue-500/30 text-blue-600 hover:bg-blue-500/20'
                  }" title="${isRunning ? '暂停' : '开始做题'}">
                    ${isRunning 
                      ? '<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>' 
                      : '<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'
                    }
                  </button>
                  <button onclick="finishProblem(${idx})" class="p-1.5 rounded-lg border border-slate-300 dark:border-slate-700 text-[var(--muted-foreground)] hover:text-emerald-500 hover:border-emerald-500/40 transition cursor-pointer" title="标记完成">
                    <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                  </button>
                ` : `
                  <button onclick="copySingleProblem(${idx})" class="text-xs px-2 py-0.5 rounded-lg border border-blue-500/30 text-blue-600 dark:text-blue-400 bg-blue-500/10 hover:bg-blue-500/20 transition flex items-center gap-1 font-medium cursor-pointer">
                    复制
                  </button>
                  <button onclick="resetProblem(${idx})" class="text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)] px-1 py-0.5 transition cursor-pointer" title="重做">
                    ↺
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
        container.appendChild(row);
      });

      document.getElementById('overallProgress').textContent = `完成: ${finishedCount} / ${items.length}`;
      document.getElementById('totalTimeDisplay').textContent = formatSecs(totalElapsed);
      updateDrawerContent();
    }

    function toggleProblem(idx) {
      if (items[idx].state === 'running') {
        items[idx].state = 'paused';
        activeIndex = null;
        stopTicker();
      } else {
        if (activeIndex !== null && activeIndex !== idx) {
          items[activeIndex].state = 'paused';
        }
        items[idx].state = 'running';
        activeIndex = idx;
        startTicker();
      }
      render();
    }

    function finishProblem(idx) {
      if (activeIndex === idx) {
        stopTicker();
        activeIndex = null;
      }
      items[idx].state = 'finished';
      render();
      showToast(`已完成 [ID ${items[idx].id}] 耗时：${formatSecs(items[idx].elapsed)}`);
    }

    function resetProblem(idx) {
      if (activeIndex === idx) {
        stopTicker();
        activeIndex = null;
      }
      items[idx].state = 'ready';
      items[idx].elapsed = 0;
      render();
    }

    function startTicker() {
      if (ticker) clearInterval(ticker);
      ticker = setInterval(() => {
        if (activeIndex !== null && items[activeIndex].state === 'running') {
          items[activeIndex].elapsed++;
          render();
        }
      }, 1000);
    }

    function stopTicker() {
      if (ticker) {
        clearInterval(ticker);
        ticker = null;
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3500);
    }

    function copyToClipboard(text, successMsg) {
      const textarea = document.getElementById('drawerText');
      if (textarea) textarea.value = text;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(successMsg || '✅ 已复制耗时！直接在聊天框发送');
        }).catch(() => {
          fallbackExecCopy(text, successMsg);
        });
      } else {
        fallbackExecCopy(text, successMsg);
      }
    }

    function fallbackExecCopy(text, successMsg) {
      try {
        const tempInput = document.createElement('textarea');
        tempInput.value = text;
        tempInput.style.position = 'fixed';
        tempInput.style.opacity = '0';
        document.body.appendChild(tempInput);
        tempInput.focus();
        tempInput.select();
        const successful = document.execCommand('copy');
        document.body.removeChild(tempInput);
        if (successful) {
          showToast(successMsg || '✅ 已复制耗时！直接在聊天框发送');
        } else {
          showDrawerFallback();
        }
      } catch (err) {
        showDrawerFallback();
      }
    }

    function showDrawerFallback() {
      const drawer = document.getElementById('exportDrawer');
      drawer.classList.remove('hidden');
      showToast('⚠️ 剪贴板受浏览器权限限制，已在下方文本框就绪，请手动复制');
    }

    function toggleExportDrawer() {
      const drawer = document.getElementById('exportDrawer');
      drawer.classList.toggle('hidden');
      if (!drawer.classList.contains('hidden')) {
        updateDrawerContent();
      }
    }

    function updateDrawerContent() {
      const textarea = document.getElementById('drawerText');
      if (!textarea) return;
      const lines = items.map(it => {
        const statusStr = it.state === 'finished' ? `已完成 (${formatSecs(it.elapsed)})` :
                          it.state === 'running' ? `进行中 (${formatSecs(it.elapsed)})` :
                          it.state === 'paused' ? `暂停 (${formatSecs(it.elapsed)})` : `待开始`;
        return `${it.num} [ID ${it.id}] ${it.name}：${statusStr}`;
      });
      const totalElapsed = items.reduce((acc, it) => acc + it.elapsed, 0);
      lines.push(`总耗时：${formatSecs(totalElapsed)}`);
      textarea.value = lines.join('\n');
    }

    function selectDrawerText() {
      const textarea = document.getElementById('drawerText');
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('✅ 文本框内容已成功复制！');
      } catch (e) {
        showToast('请直接右键或 Cmd+C 复制所选内容');
      }
    }

    function copySingleProblem(idx) {
      const it = items[idx];
      const text = `${it.num} [ID ${it.id}] 耗时：${formatSecs(it.elapsed)}`;
      copyToClipboard(text, `✅ [${it.num}] 耗时已复制！`);
    }

    function copyAllFinished() {
      updateDrawerContent();
      const textarea = document.getElementById('drawerText');
      copyToClipboard(textarea.value, '✅ P2 所有作答耗时已复制！');
    }

    // Initial render
    render();
  </script>
</body>
</html>
